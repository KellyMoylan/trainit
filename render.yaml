services:
  - type: web
    name: trainit-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trainit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
    plan: free
    autoDeploy: true
    healthCheckPath: /docs

  - type: web
    name: trainit-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    # Send every path to the app so refreshing or bookmarking a page like /view-plans works
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://trainit-backend.onrender.com
    autoDeploy: true

databases:
  - name: trainit-db
    plan: free